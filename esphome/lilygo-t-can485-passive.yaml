# Passive RS-485 sniffer for a Nibe heat pump's internal bus, on a LilyGo T-CAN485.
#
# Adapted from esphome-nibe's examples (MIT, Copyright (c) 2022 Joakim Plate):
# https://github.com/elupus/esphome-nibe
#
# Needs a secrets.yaml with: wifi_ssid, wifi_password, api_encryption_key, ota_password

esphome:
  name: nibegw
  comment: Nibegw passive sniffer

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# General ESPHome setup
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true # Fast connect to connect to my hidden network
  # It is recommended to disable powersave mode on wifi, to make sure the device does not miss UDP requests sent.
  power_save_mode: none
  # The device needs a static IP. Either do that here with the manual_ip node, or do it via another way (router)

# Load nibe component
external_components:
  - source: github://elupus/esphome-nibe

# Set pins required for LilyGo T-CAN485 board
output:
  - platform: gpio
    id: ENABLE_PIN # Enable the chip
    pin:
      number: GPIO19
      inverted: true
  - platform: gpio
    id: SE_PIN # Enable autodirection
    pin:
      number: GPIO17
      inverted: true
  - platform: gpio
    id: ENABLE_5V_PIN # Enable 5V pin for RS485 chip
    pin:
      number: GPIO16
      inverted: true

# Configure uart that will be used
uart:
  rx_pin: GPIO21
  tx_pin: GPIO22
  baud_rate: 9600

# Configure NibeGW in passive/read-only mode.
#
# This variant is intended for heat pumps that do NOT have an official
# external MODBUS/RS485 accessory port. Instead of acting as an accessory
# that must ACK/NAK every telegram, this config only listens to the internal
# RS-485 bus and forwards what it hears over UDP.
#
# Nothing is ever written back to the RS-485 bus:
#   - `acknowledge` is intentionally omitted/empty, so no ACK/NAK byte is
#     ever sent for any address.
#   - `constants` is intentionally omitted, so no token/accessory responses
#     are ever generated.
#   - No `climate` platform (virtual RMU) is configured, since that also
#     relies on acknowledging an address and injecting responses.
#
# The gateway code only ever writes to the UART when an address has been
# added via `acknowledge`, so leaving it empty guarantees a fully passive
# tap that cannot disturb the bus or trigger an alarm on the heat pump.
nibegw:
  udp:
    # List of source address to accept data from, may be empty for no filter
    source:

    # Optional port this device will listen to to receive read requests. Defaults to 9999
    # read_port: 9999

    # Optional port this device will listen to to receive write request. Defaults to 10000
    # write_port: 10000

  # No acknowledge / constants sections: the gateway never talks on the bus.

# Some helper functions to restart ESPHome from HA
button:
  - platform: restart
    name: Nibegw Restart
  - platform: safe_mode
    name: Nibegw Safe Mode Boot
